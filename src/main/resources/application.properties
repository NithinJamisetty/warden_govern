# Server Configuration
server.port=8080

# ==========================================
# DATABASE CONFIGURATION (DEFAULT: IN-MEMORY H2)
# ==========================================
spring.datasource.url=jdbc:h2:mem:swmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console for local inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.h2.console.settings.trace=false

# ==========================================
# PRODUCTION DATABASE CONFIGURATION (SUPABASE POSTGRESQL)
# ==========================================
# To use Supabase, uncomment the lines below and comment out the H2 config above:
# spring.datasource.url=jdbc:postgresql://db.xxxxxx.supabase.co:5432/postgres?sslmode=require
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=YOUR_SUPABASE_PASSWORD
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SECURITY / JWT CONFIGURATION
# ==========================================
# Must be at least 256 bits (32 characters)
swms.jwt.secret=ThisIsASecretKeyForSWMSProjectWhichIsAtLeast256BitsLongAndSecure!
swms.jwt.expirationMs=86400000

# ==========================================
# SPRING SECURITY FRAMEWORK SETTINGS
# ==========================================
# Allow frame option so H2 console can display in standard frames
spring.headers.frame-options.sameorigin=true
